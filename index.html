<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haxball</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe9;--fg:#1d2a24;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131817;--fg:#e8ece9;--card:#222b29}}
:root[data-theme="dark"]{--bg:#131817;--fg:#e8ece9;--card:#222b29}
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:12px}
h1,h2{margin:0;font:400 2rem Anton,Impact,'Arial Narrow',sans-serif;letter-spacing:.05em;text-transform:uppercase}
#scr{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:420px;padding-top:6vh}
#scr label{font-weight:700;align-self:flex-start}
#scr small{opacity:.7;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 24px;background:#f4c542;color:#1d2a24;cursor:pointer}
button.m{width:100%;font-size:1.2rem;padding:14px 20px;border-radius:18px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
button.m:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
button.m.w{background:#fff}
#scr .m small{opacity:.65;font-weight:500;text-align:left}
button.s{background:var(--card);color:var(--fg);border:2px solid rgba(128,128,128,.35);padding:8px 16px}
button.s.on{background:#f4c542;color:#1d2a24;border-color:#f4c542}
button:focus-visible{outline:3px solid #f4c542;outline-offset:2px}
input[type=number],input[type=text]{font:inherit;width:130px;text-transform:uppercase;padding:8px;border-radius:10px;border:2px solid rgba(128,128,128,.35);background:var(--card);color:var(--fg);user-select:text}
input[type=range]{width:100%}
input[type=color]{width:56px;height:40px;border:0;background:none}
#game{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}
.score{display:flex;align-items:center;gap:14px;font-size:2rem;font-weight:800}
.wrap{position:relative}
#idc{position:absolute;inset:8px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:rgba(10,20,15,.84);border-radius:14px;color:#fff;padding:12px;overflow:auto;z-index:3}
.chip{display:inline-block;background:rgba(128,128,128,.22);border-radius:999px;padding:2px 10px;margin:2px 4px 0 0;font-size:.8rem;font-weight:700}
body.pitch{background:#2f7d4f linear-gradient(90deg,rgba(255,255,255,.05) 50%,transparent 50%) 0 0/160px 100%;color:#fff}
html,body.pitch,body.pitch *{touch-action:pan-y}
body.pitch input[type=range]{touch-action:none}
body.pitch::before{content:"";position:fixed;left:50%;top:-70px;width:280px;height:280px;margin-left:-140px;border:3px solid rgba(255,255,255,.22);border-radius:50%;pointer-events:none;z-index:-1}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px}
.logo h1{font-size:3.8rem;font-style:italic;text-shadow:0 4px 0 rgba(0,0,0,.28)}
.ball{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ddd 60%,#999);box-shadow:0 4px 0 rgba(0,0,0,.25);animation:roll 2.4s ease-in-out infinite alternate}
@keyframes roll{to{transform:translateX(40px) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
#rp{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;color:#fff;font:400 1.2rem Anton,Impact,sans-serif;letter-spacing:.12em;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#gc{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,20,15,.88);color:#fff;border-radius:16px;padding:10px 18px;display:flex;align-items:center;gap:14px;max-width:96%}
#gc .nb{font:400 2.6rem/1 Anton,Impact,sans-serif;border-radius:12px;padding:4px 12px}
canvas{width:100%;display:block;border-radius:14px;background:#2f7d4f}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,20,15,.72);border-radius:14px;color:#fff;text-align:center;padding:16px}
#pad,#kick,#pass{position:fixed;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:2px solid rgba(128,128,128,.35)}
#knob{position:absolute;width:40%;height:40%;left:30%;top:30%;border-radius:50%;background:#e5483f}
#kick,#pass{padding:0;color:var(--fg)}
#kick.on,#pass.on{background:#f4c542;color:#1d2a24}
.ghost{pointer-events:none;opacity:.6}
.edit{outline:3px dashed #f4c542;outline-offset:4px}
#editbar{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;gap:12px;align-items:center;justify-content:center;background:var(--card);z-index:5}
</style>
</head>
<body>
<div id="scr"></div>
<div id="game" hidden>
 <div class="top"><button class="s" onclick="open_('menu')">Menú</button><div class="score"><span id="s0">0</span><span>–</span><span id="s1">0</span></div><span id="tm" style="min-width:80px;text-align:right;font-weight:800;font-size:1.2rem">2:00</span></div>
 <div class="wrap"><canvas id="c" width="800" height="400"></canvas>
 <div class="ov" id="ov" hidden><h2 id="t"></h2><button id="go" onclick="again()">Jugar de nuevo</button></div><div id="rp" hidden><span>REPETICIÓN</span><button class="s" onclick="endRp()">Saltar</button></div><div id="gc" hidden></div><div id="idc" hidden onclick="this.hidden=true;idT=0"></div></div>
 <small id="hint" style="opacity:.7"></small>
</div>
<div id="pad" style="display:none"><div id="knob"></div></div>
<button id="kick" style="display:none">Shoot</button><button id="pass" style="display:none">Pass</button>
<div id="editbar" hidden><span>Arrastra los botones</span><button onclick="open_('set')">Listo</button></div>
<script>
const $=id=>document.getElementById(id);
let W=800,H=400,GH=130;const WIN=99,DIFF=[[.2,.12,0,0],[.3,.7,4,.5],[.34,1,9,.8],[.4,1,14,1]],PATS=['liso','rayas','franjas','mitades','puntos'];
let cfg={num:'7',pat:'liso',c1:'#e5483f',c2:'#ffffff'},ui={s:1,d:1,pad:[.2,.82],kick:[.82,.82],pass:[.82,.64]},st={pj:0,gf:0,gc:0,w:0,h:[]},cr=null,cl=null;
try{const d=JSON.parse(localStorage.getItem('mh'));if(d){cfg=d.cfg||cfg;ui=d.ui||ui;st=d.st||st;cr=d.cr||null;cl=d.cl||null;if(ui.d==null)ui.d=1;if(!ui.pass)ui.pass=[.82,.64];st.w=st.w||0;st.h=st.h||[]}}catch(e){}
const save=()=>{try{localStorage.setItem('mh',JSON.stringify({cfg,ui,st,cr,cl}))}catch(e){}};
const P2={num:'10',pat:'mitades',c1:'#3b7ddd',c2:'#ffffff'};
const pad=$('pad'),kick_=$('kick'),pass_=$('pass'),knob=$('knob'),scr=$('scr');
let mode='pvc',editing=false,inGame=false,run=false,stick={x:0,y:0},kickT=false,keys={};

/* ---------- pantallas ---------- */
const screens={
menu:()=>`<div class="logo"><span class="ball"></span><h1>Haxball</h1><small>GRL ${grl()}, ${tier()}</small></div><button class="m" onclick="open_('play')"><b>Jugar</b><small>1v1, 2v2, 3v3 y online</small></button><button class="m w" onclick="open_('custom')"><b>Personalizar</b><small>Dorsal, patrón y colores</small></button><button class="m w" onclick="open_('set')"><b>Ajustes</b><small>Dificultad, sonido y botones</small></button><button class="m w" onclick="open_('stats')"><b>Stats</b><small>Goles, victorias e historial</small></button>`,
stats:()=>`<h2>Estadísticas</h2>${idCard(myCard())}${grlCard()}<div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px">${[['Partidos',st.pj],['Victorias',st.w],['Goles a favor',st.gf],['Goles en contra',st.gc],['Media de goles por partido',st.pj?(st.gf/st.pj).toFixed(2):'0.00'],['Media en contra',st.pj?(st.gc/st.pj).toFixed(2):'0.00']].map(([a,b])=>`<div style="background:var(--card);color:var(--fg);border-radius:14px;padding:14px;text-align:center"><div style="font-size:1.8rem;font-weight:800">${b}</div><small>${a}</small></div>`).join('')}</div><h2 style="font-size:1.1rem;align-self:flex-start">Últimos partidos</h2>${hist()}<small>Cuentan los partidos terminados contra el bot y online.</small><button class="s" onclick="st={pj:0,gf:0,gc:0,w:0,h:[]};save();open_('stats')">Borrar estadísticas</button><button class="s" onclick="open_('menu')">Volver</button>`,
play:()=>`<h2>Jugar</h2><button class="m" onclick="open_('liga')"><b>Modo carrera</b><small>Liga española, 4v4 en campo grande</small></button><button class="m" onclick="open_('champ')"><b>Champions</b><small>Eliminatorias 3v3 hasta la final</small></button><button class="m" onclick="play('pvc',1)"><b>1 vs 1</b><small>Contra el bot</small></button><button class="m" onclick="ask(()=>play('pvc',2))"><b>2 vs 2</b><small>Tú y un compañero bot contra 2 bots</small></button><button class="m" onclick="ask(()=>play('pvc',3))"><b>3 vs 3</b><small>Tú y 2 compañeros bot contra 3 bots</small></button><button class="m w" onclick="play('pvp')"><b>PvP local</b><small>Dos jugadores en el mismo teclado</small></button><button class="m w" onclick="open_('online')"><b>PvP online</b><small>1 vs 1 con un código de sala</small></button><button class="s" onclick="open_('menu')">Volver</button>`,
form:()=>formHTML(),
liga:()=>ligaHTML(),
champ:()=>champHTML(),
online:()=>`<h2>PvP online</h2><button class="m" onclick="online('host',1)"><b>Crear sala 1v1</b><small>Tú contra otro jugador</small></button><button class="m" onclick="online('host',2)"><b>Crear sala 2v2</b><small>Hasta 4 jugadores; los huecos los llenan bots</small></button><label>¿Tienes un código?</label><div class="row"><input type="text" id="code" maxlength="6" placeholder="CÓDIGO"><button onclick="online('guest')">Unirse</button></div><small id="msg">Tu rival debe abrir este mismo enlace e ingresar tu código.</small><button class="s" onclick="open_('menu')">Volver</button>`,
custom:()=>`<h2>Personalizar</h2><canvas id="pv" width="90" height="90" style="background:none;width:90px"></canvas><div id="idp" style="width:100%"></div>
<label>Dorsal</label><input type="number" min="0" max="99" value="${cfg.num}" oninput="cfg.num=String(Math.min(99,Math.max(0,+this.value||0)));save();prev()">
<label>Usuario</label><input type="text" maxlength="14" value="${cfg.name||''}" placeholder="tu nombre" style="text-transform:none;width:200px" oninput="cfg.name=cln(this.value);save();prev()"><label>Patrón</label><div class="row">${PATS.map(p=>`<button class="s ${cfg.pat==p?'on':''}" onclick="cfg.pat='${p}';save();open_('custom')">${p}</button>`).join('')}</div>
<label>Colores</label><div class="row"><input type="color" value="${cfg.c1}" oninput="cfg.c1=this.value;save();prev()"><input type="color" value="${cfg.c2}" oninput="cfg.c2=this.value;save();prev()"></div>
<button class="s" onclick="open_('menu')">Volver</button>`,
set:()=>`<h2>Ajustes</h2><label>Tamaño de los botones</label><input type="range" min="0.7" max="1.6" step="0.1" value="${ui.s}" oninput="ui.s=+this.value;save();applyUI()">
<label>Dificultad del bot</label><div class="row">${['Fácil','Normal','Difícil','Experto'].map((n,i)=>`<button class="s ${ui.d==i?'on':''}" onclick="ui.d=${i};save();open_('set')">${n}</button>`).join('')}</div><button class="s" onclick="ui.snd=ui.snd===0?1:0;save();open_('set')">Sonido: ${ui.snd===0?'no':'sí'}</button><button class="m" onclick="edit()">Mover botones</button><button class="s" onclick="ui.s=1;ui.pad=[.2,.82];ui.kick=[.82,.82];ui.pass=[.82,.64];save();open_('set')">Restablecer</button><button class="s" onclick="open_('menu')">Volver</button>`
};
function open_(n){leaveRoom();document.body.className='pitch';camp=null;rp=null;winPend=0;idT=0;$('idc').hidden=true;$('rp').hidden=true;$('gc').hidden=true;editing=false;run=false;inGame=false;$('game').hidden=true;$('editbar').hidden=true;scr.hidden=false;scr.innerHTML=screens[n]();
 const sh=n==='set';pad.style.display=kick_.style.display=sh?'block':'none';pad.className=kick_.className=sh?'ghost':'';applyUI();if(n==='custom')prev()}
function prev(){if($('idp'))$('idp').innerHTML=idCard(myCard());const c=$('pv').getContext('2d');c.clearRect(0,0,90,90);drawP(c,{x:45,y:45,r:36,k:0},cfg)}
function applyUI(){pad.style.width=pad.style.height=140*ui.s+'px';kick_.style.width=kick_.style.height=96*ui.s+'px';
 pad.style.left=ui.pad[0]*100+'%';pad.style.top=ui.pad[1]*100+'%';kick_.style.left=ui.kick[0]*100+'%';kick_.style.top=ui.kick[1]*100+'%';pass_.style.width=pass_.style.height=84*ui.s+'px';pass_.style.left=ui.pass[0]*100+'%';pass_.style.top=ui.pass[1]*100+'%';syncPass()}
function edit(){editing=true;scr.hidden=true;$('editbar').hidden=false;pad.className=kick_.className='edit';syncPass()}
function drag(el,key){el.addEventListener('pointerdown',e=>{if(!editing)return;el.setPointerCapture(e.pointerId);el._d=1});
 el.addEventListener('pointermove',e=>{if(!editing||!el._d)return;ui[key]=[Math.min(.95,Math.max(.05,e.clientX/innerWidth)),Math.min(.95,Math.max(.05,e.clientY/innerHeight))];applyUI()});
 el.addEventListener('pointerup',()=>{el._d=0;save()})}
drag(pad,'pad');drag(kick_,'kick');drag(pass_,'pass');

/* ---------- controles ---------- */
addEventListener('keydown',e=>{keys[e.code]=1;if(inGame&&e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
function mv(e){const r=pad.getBoundingClientRect(),h=r.width/2;let x=(e.clientX-r.left-h)/h,y=(e.clientY-r.top-h)/h;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}stick={x,y};knob.style.left=30+x*30+'%';knob.style.top=30+y*30+'%'}
pad.addEventListener('pointerdown',e=>{if(editing)return;pad.setPointerCapture(e.pointerId);mv(e)});
pad.addEventListener('pointermove',e=>{if(!editing&&(e.buttons||e.pressure))mv(e)});
const rel=()=>{stick={x:0,y:0};knob.style.left='30%';knob.style.top='30%'};
pad.addEventListener('pointerup',rel);pad.addEventListener('pointercancel',rel);
kick_.addEventListener('pointerdown',()=>{if(editing)return;kickT=true;kick_.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>kick_.addEventListener(n,()=>{kickT=false;kick_.classList.remove('on')}));
pass_.addEventListener('pointerdown',()=>{if(editing)return;passT=true;pass_.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>pass_.addEventListener(n,()=>{passT=false;pass_.classList.remove('on')}));

/* ---------- dibujo de jugadores ---------- */
function drawP(c,p,s){const r=p.r,w=r*.4;c.save();c.beginPath();c.arc(p.x,p.y,r,0,7);c.clip();c.fillStyle=s.c1;c.fillRect(p.x-r,p.y-r,2*r,2*r);c.fillStyle=s.c2;
 if(s.pat==='rayas')for(let x=-r+w/2;x<r;x+=w*2)c.fillRect(p.x+x,p.y-r,w,2*r);
 if(s.pat==='franjas')for(let y=-r+w/2;y<r;y+=w*2)c.fillRect(p.x-r,p.y+y,2*r,w);
 if(s.pat==='mitades')c.fillRect(p.x,p.y-r,r,2*r);
 if(s.pat==='puntos')for(let i=-1;i<2;i++)for(let j=-1;j<2;j++){c.beginPath();c.arc(p.x+i*r*.7,p.y+j*r*.7,r*.15,0,7);c.fill()}
 c.restore();c.beginPath();c.arc(p.x,p.y,r,0,7);c.lineWidth=3;c.strokeStyle=p.k>0?'#f4c542':'#fff';c.stroke();
 c.font=`800 ${r*.85}px system-ui`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=3;c.strokeStyle='#000';c.strokeText(s.num,p.x,p.y+1);c.fillStyle='#fff';c.fillText(s.num,p.x,p.y+1)}

/* ---------- juego ---------- */
const g=$('c').getContext('2d');
function mk(x,y,r,m){return{x,y,vx:0,vy:0,r,m,k:0}}
let me,bot,ball,sc=[0,0],pause=0;
function reset(keep){const old=keep?[me,bot,...ext]:[],n=teamN,sh=mode==='pvc'||mode==='pvp'?FM[fm].x:0,sb=mode==='pvc'?FM[fb].x:0,RX=[[W*.29,H/2],[W*.17+sh*W,H*.25],[W*.17+sh*W,H*.75],[W*.07+sh*W/2,H/2]],RXB=[[W*.29,H/2],[W*.17+sb*W,H*.25],[W*.17+sb*W,H*.75],[W*.07+sb*W/2,H/2]];
 const mkp=(i,t,k,num)=>{const r=(t?RXB:RX)[k],p=mk(t?W-r[0]:r[0],k?r[1]:H/2,17,1);p.t=t;p.n=num;p.o=k%2?50:-50;p.g=old[i]?old[i].g:0;return p};
 me=mkp(0,0,0,cfg.num);bot=mkp(1,1,0,P2.num);ext=[];let id=2;
 for(let k=1;k<n;k++)ext.push(mkp(id++,0,k,['8','4','6'][k-1]));
 for(let k=1;k<n;k++)ext.push(mkp(id++,1,k,['9','5','3'][k-1]));
 ball=mk(W/2,H/2,10,.6);ball.last=null;if(camp)for(const p of[me,bot,...ext])p.lk={...kitOf(p.t),num:p.n}}
function play(m,n,big,cp){mode=m;tl=7200;sd=0;sdT=0;camp=cp||null;setField(big);fb=Math.floor(Math.random()*3);$('go').textContent=cp?'Continuar':'Jugar de nuevo';teamN=n||1;ext=[];rb=[];rp=null;winPend=0;document.body.className='';$('rp').hidden=true;$('gc').hidden=true;scr.hidden=true;$('game').hidden=false;$('ov').hidden=true;$('go').hidden=false;pad.style.display=kick_.style.display='block';pad.className=kick_.className='';applyUI();
 $('hint').textContent=m==='pvc'?'Mueve con flechas/WASD o el joystick. Patea con espacio, pasa con E.':'Rojo: WASD, espacio y E. Azul: flechas, Enter y Shift derecho.';
 sc=[0,0];$('s0').textContent=$('s1').textContent=0;reset();pause=0;run=true;inGame=true}
function kick(p){if(p.k>0)return;const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy)||1;if(d<p.r+ball.r+5){ball.vx+=dx/d*7.5;ball.vy+=dy/d*7.5;p.k=14;ball.last=p;beep(240,.09)}}
function col(a,b,e){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d>=m||!d)return;
 const nx=dx/d,ny=dy/d,tm=a.m+b.m,o=m-d;a.x-=nx*o*b.m/tm;a.y-=ny*o*b.m/tm;b.x+=nx*o*a.m/tm;b.y+=ny*o*a.m/tm;
 const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn>0)return;const j=-(1+e)*vn/(1/a.m+1/b.m);
 a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;b.vx+=j*nx/b.m;b.vy+=j*ny/b.m}
function acc(p,ax,ay,f){const l=Math.hypot(ax,ay);if(l>1){ax/=l;ay/=l}p.vx+=ax*f;p.vy+=ay*f}
function think(){const D=DIFF[ui.d]||DIFF[1],bx=ball.x+ball.vx*D[2],by=ball.y+ball.vy*D[2],gy=ui.d>=2?(me.y<H/2?H/2+GH*.3:H/2-GH*.3):H/2,dx=bx,dy=by-gy,l=Math.hypot(dx,dy)||1;
 let ax=bx+dx/l*(ball.r+bot.r+4)-bot.x,ay=by+dy/l*(ball.r+bot.r+4)-bot.y;
 if(ball.x>bot.x+4){ay=(ball.y<H/2?ball.y+45:ball.y-45)-bot.y;ax=ball.x+60>W?-1:Math.min(ax,0)}
 acc(bot,ax/30,ay/30,D[0]);if(ball.x<=bot.x+12&&Math.random()<D[1])kick(bot)}
function wall(p,b){const e=b?.6:0;
 if(p.y<p.r){p.y=p.r;p.vy=Math.abs(p.vy)*e}if(p.y>H-p.r){p.y=H-p.r;p.vy=-Math.abs(p.vy)*e}
 if(b&&Math.abs(p.y-H/2)<GH/2-p.r*.3)return;
 if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx)*e}if(p.x>W-p.r){p.x=W-p.r;p.vx=-Math.abs(p.vx)*e}}
function goal(i){beep(520,.45);startReplay(i);sc[i]++;$('s'+i).textContent=sc[i];pause=70;
 if(sd||sc[i]>=WIN){run=false;wi=i;if(mode==='pvc'||mode==='host')record(sc[0],sc[1]);$('t').textContent=mode!=='pvp'?(i?'Perdiste':'¡Ganaste!'):(i?'Gana el azul':'Gana el rojo');if(!rp)$('ov').hidden=false;else winPend=1}}
function step(){
 if(pause>0){pause--;if(!pause&&run)reset(1);return}
